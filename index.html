<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>소개팅 💘</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #080818; min-height: 100vh; color: #fff; overflow-x: hidden; }

    /* ── 배경 블롭 ── */
    .bg-blob {
      position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0;
    }
    .blob1 { width: 500px; height: 500px; background: rgba(255,100,150,0.07); top: -100px; left: -100px; animation: blobMove 8s ease-in-out infinite; }
    .blob2 { width: 600px; height: 600px; background: rgba(150,100,255,0.07); bottom: -150px; right: -150px; animation: blobMove 10s ease-in-out infinite reverse; }
    @keyframes blobMove { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(30px,-20px) scale(1.05)} }

    /* ── 로그인 오버레이 ── */
    #login-overlay {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      background: #080818;
      transition: opacity 0.5s ease;
    }
    #login-overlay.hidden { opacity: 0; pointer-events: none; }

    .login-card {
      position: relative;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 28px;
      padding: 3rem 2.5rem;
      width: min(380px, 90vw);
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
      animation: cardIn 0.7s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes cardIn { from{opacity:0;transform:translateY(40px) scale(.95)} to{opacity:1;transform:none} }

    .login-emoji { font-size: 3.5rem; margin-bottom: 0.5rem; display: block; animation: heartbeat 2s ease-in-out infinite; }
    @keyframes heartbeat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }

    .login-card h1 {
      font-size: 2.2rem; font-weight: 900; letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ff6496, #c064ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 0.5rem;
    }
    .login-card .tagline {
      font-size: 0.88rem; color: rgba(255,255,255,0.45); font-weight: 300;
      line-height: 1.6; margin-bottom: 2rem;
    }

    .google-btn {
      width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: #fff; color: #1f1f1f;
      border: none; border-radius: 14px;
      padding: 0.9rem 1.2rem;
      font-size: 0.95rem; font-weight: 600;
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: all 0.25s ease;
    }
    .google-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
    .google-btn:active { transform: translateY(0); }
    .google-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .login-notice {
      font-size: 0.72rem; color: rgba(255,255,255,0.25);
      margin-top: 1.2rem; line-height: 1.5;
    }

    /* ── 메인 앱 ── */
    #app { display: none; position: relative; z-index: 1; min-height: 100vh; }

    /* ── 헤더 ── */
    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.2rem 2rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .app-header h1 {
      font-size: 1.3rem; font-weight: 900;
      background: linear-gradient(135deg, #ff6496, #c064ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .user-info { display: flex; align-items: center; gap: 0.7rem; }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(255,100,150,0.5); }
    .user-name { font-size: 0.82rem; color: rgba(255,255,255,0.6); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .logout-btn {
      font-size: 0.75rem; color: rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px; padding: 0.28rem 0.8rem;
      cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
      transition: all 0.2s;
    }
    .logout-btn:hover { background: rgba(255,100,150,0.15); color: #ff8ab4; border-color: rgba(255,100,150,0.3); }

    /* ── 갤러리 타이틀 ── */
    .gallery-header { text-align: center; padding: 2.5rem 1rem 0.5rem; }
    .gallery-header p { font-size: 0.88rem; color: rgba(255,255,255,0.35); font-weight: 300; }

    /* ── 갤러리 그리드 ── */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.2rem;
      max-width: 860px; margin: 2rem auto;
      padding: 0 1.5rem 4rem;
    }
    .profile-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 20px; padding: 1.5rem 1rem;
      text-align: center; cursor: pointer;
      text-decoration: none; color: inherit; display: block;
      transition: all 0.3s ease;
      animation: fadeUp 0.6s cubic-bezier(0.22,1,0.36,1) both;
    }
    .profile-card:nth-child(2) { animation-delay: 0.08s; }
    .profile-card:nth-child(3) { animation-delay: 0.16s; }
    .profile-card:nth-child(4) { animation-delay: 0.24s; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:none} }
    .profile-card:hover { transform: translateY(-6px); border-color: rgba(255,100,150,0.4); box-shadow: 0 20px 40px rgba(255,100,150,0.12); }

    .card-photo-wrap { position: relative; width: 90px; height: 90px; margin: 0 auto 0.9rem; }
    .card-photo { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; object-position: center 30%; border: 2px solid rgba(255,100,150,0.4); }
    .card-online { position: absolute; bottom: 2px; right: 2px; width: 13px; height: 13px; border-radius: 50%; background: #ff6496; border: 2px solid #080818; box-shadow: 0 0 8px #ff6496; animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .card-name { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.2rem; }
    .card-school { font-size: 0.7rem; color: rgba(255,255,255,0.35); margin-bottom: 0.5rem; }
    .card-desc { font-size: 0.78rem; color: rgba(255,255,255,0.5); line-height: 1.4; margin-bottom: 0.9rem; }
    .card-btn {
      display: inline-block; padding: 0.38rem 1.1rem;
      background: linear-gradient(135deg, #ff6496, #c064ff);
      border-radius: 999px; font-size: 0.75rem; font-weight: 600; color: #fff;
    }

    /* 로딩 스피너 */
    #loading-screen {
      position: fixed; inset: 0; z-index: 200;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #080818; gap: 1rem;
    }
    .spinner {
      width: 40px; height: 40px; border-radius: 50%;
      border: 3px solid rgba(255,100,150,0.2);
      border-top-color: #ff6496;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-screen p { font-size: 0.82rem; color: rgba(255,255,255,0.3); }

    @media (max-width: 480px) {
      .app-header { padding: 1rem; }
      .gallery { grid-template-columns: repeat(2, 1fr); gap: 0.8rem; padding: 0 1rem 3rem; }
    }
  </style>
</head>
<body>

  <!-- 로딩 스피너 (Firebase 초기화 전) -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <p>잠깐만요...</p>
  </div>

  <!-- 배경 블롭 -->
  <div class="bg-blob blob1"></div>
  <div class="bg-blob blob2"></div>

  <!-- ── 로그인 오버레이 ── -->
  <div id="login-overlay">
    <div class="login-card">
      <span class="login-emoji">💘</span>
      <h1>소개팅</h1>
      <p class="tagline">마음에 드는 사람을 찾아봐요<br/>Google 계정으로 시작하세요</p>
      <button class="google-btn" id="google-login-btn" onclick="signInWithGoogle()">
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Google로 계속하기
      </button>
      <p class="login-notice">로그인 정보는 소개팅 서비스 외 목적으로 사용되지 않아요</p>
    </div>
  </div>

  <!-- ── 메인 앱 ── -->
  <div id="app">
    <header class="app-header">
      <h1>소개팅 💘</h1>
      <div class="user-info">
        <img class="user-avatar" id="user-avatar" src="" alt="" />
        <span class="user-name" id="user-name"></span>
        <button class="logout-btn" onclick="signOut()">로그아웃</button>
      </div>
    </header>

    <div class="gallery-header">
      <p>마음에 드는 사람을 골라봐요</p>
    </div>

    <div class="gallery" id="gallery"></div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="profiles.js"></script>
  <script>
    // Firebase 직접 초기화 (firebase-config.js 의존 제거)
    const _cfg = {
      apiKey:            "AIzaSyBwR21PEU_jhb8oLJKXgPIzcvGm8I9_wVs",
      authDomain:        "love0523-33af7.firebaseapp.com",
      projectId:         "love0523-33af7",
      storageBucket:     "love0523-33af7.firebasestorage.app",
      messagingSenderId: "723908766892",
      appId:             "1:723908766892:web:8947621736a7a3a75d4309"
    };
    if (!firebase.apps.length) firebase.initializeApp(_cfg);
    const _auth     = firebase.auth();
    const _provider = new firebase.auth.GoogleAuthProvider();

    const errEl = document.createElement('p');
    errEl.style.cssText = 'font-size:.78rem;color:#ff6b8a;margin-top:.8rem;min-height:1rem;';
    document.querySelector('.login-card').appendChild(errEl);

    // 리다이렉트 복귀 처리
    _auth.getRedirectResult()
      .then(r => { if (r && r.user) errEl.textContent = ''; })
      .catch(e => { errEl.textContent = '오류: ' + (e.message || '다시 시도해주세요'); });

    const GOOGLE_BTN_HTML = document.getElementById('google-login-btn').innerHTML;

    async function signInWithGoogle() {
      const btn = document.getElementById('google-login-btn');
      btn.disabled = true;
      btn.textContent = '로그인 중...';
      errEl.textContent = '';

      try {
        await _auth.signInWithPopup(_provider);
      } catch (e) {
        if (e.code === 'auth/popup-blocked' || e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') {
          errEl.textContent = '잠시 후 Google 로그인 페이지로 이동해요...';
          try {
            await _auth.signInWithRedirect(_provider);
          } catch (e2) {
            errEl.textContent = '오류: ' + (e2.message || '다시 시도해주세요');
            btn.disabled = false;
            btn.innerHTML = GOOGLE_BTN_HTML;
          }
        } else {
          errEl.textContent = '오류: ' + (e.message || '다시 시도해주세요');
          btn.disabled = false;
          btn.innerHTML = GOOGLE_BTN_HTML;
        }
      }
    }

    function signOut() {
      _auth.signOut();
    }

    _auth.onAuthStateChanged(user => {
      // 로딩 화면 즉시 숨김
      document.getElementById('loading-screen').style.display = 'none';

      const overlay = document.getElementById('login-overlay');
      const app     = document.getElementById('app');
      if (user) {
        overlay.classList.add('hidden');
        setTimeout(() => { overlay.style.display = 'none'; }, 500);
        app.style.display = 'block';
        document.getElementById('user-avatar').src = user.photoURL || '';
        document.getElementById('user-name').textContent = user.displayName || user.email;
        buildGallery();
      } else {
        overlay.style.display = 'flex';
        overlay.classList.remove('hidden');
        app.style.display = 'none';
      }
    });

    function buildGallery() {
      const gallery = document.getElementById('gallery');
      if (gallery.children.length > 0) return; // 중복 빌드 방지
      PROFILES.forEach(p => {
        const a = document.createElement('a');
        a.className = 'profile-card';
        a.href = `profile.html?id=${p.id}`;
        a.innerHTML = `
          <div class="card-photo-wrap">
            <img class="card-photo" src="${p.photo}" alt="${p.name}" />
            <div class="card-online"></div>
          </div>
          <div class="card-name">${p.name}</div>
          <div class="card-school">${p.school}</div>
          <div class="card-desc">${p.description}</div>
          <div class="card-btn">프로필 보기 →</div>
        `;
        gallery.appendChild(a);
      });
    }
  </script>
</body>
</html>
