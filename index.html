<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>김위진 소개팅 페이지</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <main class="main">
    <div class="scene" id="scene">
      <div class="card" id="card">
        <div class="card-glow"></div>

        <div class="photo-section">
          <div class="photo-frame">
            <img src="images/profile.png" alt="김위진" class="profile-photo" />
            <div class="photo-ring"></div>
            <div class="photo-ring ring2"></div>
          </div>
          <div class="status-pill">
            <span class="status-dot"></span>
            모집중
          </div>
        </div>

        <div class="info-section">
          <div class="name-row">
            <h1 class="name">김위진</h1>
            <span class="age-badge">고등학생</span>
          </div>
          <p class="description">평범하고 따뜻한 사람 🤍</p>

          <div class="divider"></div>

          <div class="ideal-area">
            <p class="section-label">이상형</p>
            <div class="chips">
              <div class="chip">여성 ♀</div>
              <div class="chip">160cm 이하</div>
              <div class="chip">55kg 이하</div>
              <div class="chip">B컵 이상</div>
            </div>
          </div>

          <button class="cta-btn" onclick="handleCTA()">
            💌 &nbsp;연락하기
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- ===== 모달 오버레이 ===== -->
  <div class="modal-overlay" id="modal-overlay" onclick="overlayClick(event)">

    <!-- STEP 1: 인스타그램 ID 입력 -->
    <div class="modal" id="step1">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-emoji">💌</div>
      <h2>연락하기</h2>
      <p class="modal-sub">인스타그램 아이디를 입력해주세요</p>
      <div class="input-wrap">
        <span class="input-at">@</span>
        <input
          id="ig-input"
          type="text"
          placeholder="instagram_id"
          autocomplete="off"
          autocapitalize="none"
          onkeydown="if(event.key==='Enter') submitStep1()"
        />
      </div>
      <p class="input-error" id="input-error"></p>
      <button class="modal-btn primary" onclick="submitStep1()">다음 →</button>
    </div>

    <!-- STEP 2: 팔로우 유도 -->
    <div class="modal" id="step2" style="display:none;">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-emoji">🎉</div>
      <h2>거의 다 왔어요!</h2>
      <p class="modal-sub" id="step2-sub">팔로우 버튼을 눌러주세요 ☺️</p>
      <button class="modal-btn ig-btn" onclick="followIG()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white" style="margin-right:8px;flex-shrink:0;">
          <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
        </svg>
        @nxptune0 팔로우하기
      </button>
      <button class="modal-btn ghost" onclick="closeModal()">나중에</button>
    </div>

    <!-- STEP 3: 완료 -->
    <div class="modal" id="step3" style="display:none;">
      <div class="modal-emoji">💕</div>
      <h2>완료!</h2>
      <p class="modal-sub">팔로우 감사해요!<br/>위진이가 확인 후 연락드릴게요 😊</p>
      <button class="modal-btn primary" onclick="closeModal()">닫기</button>
    </div>

  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
