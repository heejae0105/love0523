<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>소개팅 💘</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #0a0010; min-height: 100vh; color: #fff; overflow-x: hidden; }

    /* ── Spline 3D 배경 ── */
    .spline-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      overflow: hidden;
    }
    spline-viewer {
      position: absolute;
      top: -5px; left: -5px;
      width: calc(100% + 10px);
      height: calc(100% + 80px); /* 워터마크 아래로 밀어서 overflow hidden으로 잘리게 */
    }

    /* 가독성을 위한 핑크빛 오버레이 */
    .bg-overlay {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(
        160deg,
        rgba(80,0,60,0.28) 0%,
        rgba(160,40,120,0.15) 40%,
        rgba(80,20,100,0.22) 100%
      );
    }

    /* ── 로그인 오버레이 ── */
    #login-overlay {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      background: transparent;
      transition: opacity 0.5s ease;
    }
    #login-overlay.hidden { opacity: 0; pointer-events: none; }

    .login-card {
      position: relative;
      background: rgba(60,10,50,0.45);
      border: 1px solid rgba(255,150,200,0.3);
      border-radius: 28px;
      padding: 3rem 2.5rem;
      width: min(380px, 90vw);
      text-align: center;
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      box-shadow: 0 30px 80px rgba(180,0,255,0.18), 0 0 0 1px rgba(255,255,255,0.04) inset;
      animation: cardIn 0.7s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes cardIn { from{opacity:0;transform:translateY(40px) scale(.95)} to{opacity:1;transform:none} }

    .login-emoji { font-size: 3.5rem; margin-bottom: 0.5rem; display: block; animation: heartbeat 2s ease-in-out infinite; }
    @keyframes heartbeat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }

    .login-card h1 {
      font-size: 2.2rem; font-weight: 900; letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ff6496, #c064ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 0.5rem;
    }
    .login-card .tagline {
      font-size: 0.88rem; color: rgba(255,255,255,0.45); font-weight: 300;
      line-height: 1.6; margin-bottom: 2rem;
    }

    .google-btn {
      width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: #fff; color: #1f1f1f;
      border: none; border-radius: 14px;
      padding: 0.9rem 1.2rem;
      font-size: 0.95rem; font-weight: 600;
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: all 0.25s ease;
    }
    .google-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
    .google-btn:active { transform: translateY(0); }
    .google-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .login-notice {
      font-size: 0.72rem; color: rgba(255,255,255,0.25);
      margin-top: 1.2rem; line-height: 1.5;
    }

    /* ── 메인 앱 ── */
    #app { display: none; position: relative; z-index: 2; min-height: 100vh; }

    /* ── 헤더 ── */
    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.2rem 2rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(60,10,50,0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .app-header h1 {
      font-size: 1.3rem; font-weight: 900;
      background: linear-gradient(135deg, #ff6496, #c064ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .user-info { display: flex; align-items: center; gap: 0.7rem; }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(255,100,150,0.5); }
    .user-name { font-size: 0.82rem; color: rgba(255,255,255,0.6); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .logout-btn {
      font-size: 0.75rem; color: rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px; padding: 0.28rem 0.8rem;
      cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
      transition: all 0.2s;
    }
    .logout-btn:hover { background: rgba(255,100,150,0.15); color: #ff8ab4; border-color: rgba(255,100,150,0.3); }

    /* ── 갤러리 타이틀 ── */
    .gallery-header { text-align: center; padding: 2.5rem 1rem 0.5rem; }
    .gallery-header p { font-size: 0.92rem; color: #fff; font-weight: 500; text-shadow: 0 1px 12px rgba(120,0,80,0.8), 0 0 24px rgba(0,0,0,0.5); letter-spacing: 0.02em; }

    /* ── 갤러리 그리드 ── */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.2rem;
      max-width: 860px; margin: 2rem auto;
      padding: 0 1.5rem 4rem;
    }
    .profile-card {
      background: rgba(60,10,50,0.38);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,150,200,0.25);
      border-radius: 20px; padding: 1.5rem 1rem;
      text-align: center; cursor: pointer;
      text-decoration: none; color: inherit; display: block;
      transition: all 0.3s ease;
      animation: fadeUp 0.6s cubic-bezier(0.22,1,0.36,1) both;
    }
    .profile-card:nth-child(2) { animation-delay: 0.08s; }
    .profile-card:nth-child(3) { animation-delay: 0.16s; }
    .profile-card:nth-child(4) { animation-delay: 0.24s; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:none} }
    .profile-card:hover { transform: translateY(-6px); border-color: rgba(255,100,150,0.4); box-shadow: 0 20px 40px rgba(255,100,150,0.12); }

    .card-photo-wrap { position: relative; width: 90px; height: 90px; margin: 0 auto 0.9rem; }
    .card-photo { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; object-position: center 30%; border: 2px solid rgba(255,100,150,0.4); }
    .card-online { position: absolute; bottom: 2px; right: 2px; width: 13px; height: 13px; border-radius: 50%; background: #ff6496; border: 2px solid #080818; box-shadow: 0 0 8px #ff6496; animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .card-name { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.2rem; }
    .card-school { font-size: 0.7rem; color: rgba(255,255,255,0.35); margin-bottom: 0.5rem; }
    .card-desc { font-size: 0.78rem; color: rgba(255,255,255,0.5); line-height: 1.4; margin-bottom: 0.9rem; }
    .card-btn {
      display: inline-block; padding: 0.38rem 1.1rem;
      background: linear-gradient(135deg, #ff6496, #c064ff);
      border-radius: 999px; font-size: 0.75rem; font-weight: 600; color: #fff;
    }

    /* 로딩 스피너 */
    #loading-screen {
      position: fixed; inset: 0; z-index: 200;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0a0010; gap: 1rem;
    }
    .spinner {
      width: 40px; height: 40px; border-radius: 50%;
      border: 3px solid rgba(255,100,150,0.2);
      border-top-color: #ff6496;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-screen p { font-size: 0.82rem; color: rgba(255,255,255,0.3); }

    /* ── 하트 버튼 ── */
    .heart-btn {
      display: flex; align-items: center; justify-content: center; gap: 5px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,100,150,0.2);
      border-radius: 999px;
      padding: 0.32rem 0.85rem;
      font-size: 0.8rem; color: rgba(255,255,255,0.5);
      cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
      transition: all 0.2s ease;
      margin-top: 0.6rem;
      position: relative; z-index: 2;
    }
    .heart-btn:hover { background: rgba(255,100,150,0.15); border-color: rgba(255,100,150,0.5); }
    .heart-btn.liked { background: rgba(255,100,150,0.2); border-color: #ff6496; color: #ff8ab4; }
    .heart-icon { font-size: 1rem; transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1); display: inline-block; }
    .heart-btn.pop .heart-icon { transform: scale(1.6); }

    /* ── 메시지함 버튼 ── */
    .inbox-btn {
      position: relative;
      font-size: 0.78rem; color: rgba(255,255,255,0.7);
      background: rgba(255,100,150,0.15); border: 1px solid rgba(255,100,150,0.3);
      border-radius: 999px; padding: 0.28rem 0.85rem;
      cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
      transition: all 0.2s; display: flex; align-items: center; gap: 4px;
    }
    .inbox-btn:hover { background: rgba(255,100,150,0.25); }
    .inbox-badge {
      background: #ff6496; color: #fff; font-size: 0.65rem; font-weight: 700;
      border-radius: 999px; padding: 1px 6px; min-width: 18px; text-align: center;
    }

    /* ── 메시지함 패널 ── */
    .inbox-panel {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: min(380px, 100vw); z-index: 50;
      background: #0d0018;
      border-left: 1px solid rgba(255,150,200,0.15);
      display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
    }
    .inbox-panel.open { transform: translateX(0); }
    .inbox-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.1rem 1.2rem;
      background: rgba(60,10,50,0.6); border-bottom: 1px solid rgba(255,150,200,0.15);
      font-weight: 700; font-size: 1rem; backdrop-filter: blur(12px);
    }
    .inbox-header button {
      background: none; border: none; color: rgba(255,255,255,0.4);
      font-size: 1rem; cursor: pointer;
    }
    .inbox-list { flex: 1; overflow-y: auto; }
    .inbox-item {
      display: flex; align-items: center; gap: 0.8rem;
      padding: 0.9rem 1.2rem; cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: background 0.15s;
    }
    .inbox-item:hover { background: rgba(255,100,150,0.07); }
    .inbox-item.unread { background: rgba(255,100,150,0.06); }
    .inbox-item-avatar {
      width: 42px; height: 42px; border-radius: 50%;
      object-fit: cover; border: 2px solid rgba(255,100,150,0.3);
      flex-shrink: 0; background: rgba(255,255,255,0.05);
    }
    .inbox-item-info { flex: 1; min-width: 0; }
    .inbox-item-name { font-size: 0.88rem; font-weight: 600; margin-bottom: 0.2rem; display: flex; align-items: center; gap: 6px; }
    .inbox-unread-dot { background: #ff6496; color: #fff; font-size: 0.65rem; border-radius: 999px; padding: 1px 6px; }
    .inbox-item-last { font-size: 0.75rem; color: rgba(255,255,255,0.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .inbox-chat-header {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.9rem 1.2rem;
      background: rgba(60,10,50,0.5); border-bottom: 1px solid rgba(255,150,200,0.15);
      font-weight: 700;
    }
    .chat-messages-wrap { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .chat-msg { max-width: 72%; padding: 0.6rem 0.95rem; border-radius: 18px; font-size: 0.9rem; line-height: 1.45; word-break: break-word; }
    .chat-msg.mine { background: linear-gradient(135deg,#ff6496,#c064ff); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
    .chat-msg.theirs { background: rgba(255,255,255,0.1); color:rgba(255,255,255,0.9); align-self:flex-start; border-bottom-left-radius:4px; }
    .chat-input-row { display:flex; gap:0.5rem; padding:0.8rem; border-top:1px solid rgba(255,150,200,0.15); background:rgba(60,10,50,0.5); }
    .chat-input-row input { flex:1; background:rgba(255,255,255,0.08); border:1px solid rgba(255,150,200,0.2); border-radius:999px; padding:0.65rem 1rem; color:#fff; font-family:'Noto Sans KR',sans-serif; font-size:0.88rem; outline:none; }
    .chat-input-row input:focus { border-color:rgba(255,100,150,0.5); }
    .chat-input-row button { background:linear-gradient(135deg,#ff6496,#c064ff); border:none; border-radius:999px; padding:0.65rem 1.1rem; color:#fff; font-weight:600; cursor:pointer; font-family:'Noto Sans KR',sans-serif; }
    .chat-back-btn { background:none; border:none; color:#ff8ab4; font-size:1.2rem; cursor:pointer; padding:0.2rem 0.4rem; }

    @media (max-width: 480px) {
      .app-header { padding: 1rem; }
      .gallery { grid-template-columns: repeat(2, 1fr); gap: 0.8rem; padding: 0 1rem 3rem; }
      .float-ig { width: 55px; }
      .float-creature { width: 65px; }
      .float-ig2, .float-creature2 { display: none; }
    }
  </style>
</head>
<body>

  <!-- 로딩 스피너 (Firebase 초기화 전) -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <p>잠깐만요...</p>
  </div>

  <!-- Spline 3D 배경 -->
  <div class="spline-bg">
    <spline-viewer url="https://prod.spline.design/4WjEktaxmm-6tVQu/scene.splinecode"></spline-viewer>
  </div>
  <div class="bg-overlay"></div>


  <!-- ── 로그인 오버레이 ── -->
  <div id="login-overlay">
    <div class="login-card">
      <span class="login-emoji">💘</span>
      <h1>소개팅</h1>
      <p class="tagline">마음에 드는 사람을 찾아봐요<br/>Google 계정으로 시작하세요</p>
      <button class="google-btn" id="google-login-btn" onclick="signInWithGoogle()">
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Google로 계속하기
      </button>
      <p class="login-notice">로그인 정보는 소개팅 서비스 외 목적으로 사용되지 않아요</p>
    </div>
  </div>

  <!-- ── 메인 앱 ── -->
  <div id="app">
    <header class="app-header">
      <h1>소개팅 💘</h1>
      <div class="user-info">
        <img class="user-avatar" id="user-avatar" src="" alt="" />
        <span class="user-name" id="user-name"></span>
        <button class="inbox-btn" id="inbox-btn" style="display:none" onclick="openInbox()">
          💌 <span class="inbox-badge" id="inbox-badge" style="display:none">0</span>
        </button>
        <button class="logout-btn" onclick="signOut()">로그아웃</button>
      </div>
    </header>

    <!-- 메시지함 패널 -->
    <div class="inbox-panel" id="inbox-panel">
      <div class="inbox-header">
        <span>💌 메시지함</span>
        <button id="inbox-close-btn" onclick="closeInbox()">✕</button>
      </div>
      <!-- 대화 목록 -->
      <div id="inbox-list-view" style="display:flex;flex-direction:column;flex:1;overflow:hidden;">
        <div class="inbox-list" id="inbox-list"></div>
      </div>
      <!-- 채팅 뷰 -->
      <div id="inbox-chat-view" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
        <div class="inbox-chat-header">
          <button class="chat-back-btn" id="inbox-back-btn">←</button>
          <span id="inbox-chat-title"></span>
        </div>
        <div class="chat-messages-wrap" id="inbox-messages"></div>
        <div class="chat-input-row">
          <input type="text" id="inbox-input" placeholder="메시지를 입력하세요..." autocomplete="off" />
          <button id="inbox-send-btn">전송</button>
        </div>
      </div>
    </div>

    <div class="gallery-header">
      <p>마음에 드는 사람을 골라봐요</p>
    </div>

    <div class="gallery" id="gallery"></div>
  </div>

  <!-- Spline 3D viewer -->
  <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.82/build/spline-viewer.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="profiles.js"></script>
  <script>
    // Firebase 직접 초기화 (firebase-config.js 의존 제거)
    const _cfg = {
      apiKey:            "AIzaSyBwR21PEU_jhb8oLJKXgPIzcvGm8I9_wVs",
      authDomain:        "love0523-33af7.firebaseapp.com",
      projectId:         "love0523-33af7",
      storageBucket:     "love0523-33af7.firebasestorage.app",
      messagingSenderId: "723908766892",
      appId:             "1:723908766892:web:8947621736a7a3a75d4309"
    };
    if (!firebase.apps.length) firebase.initializeApp(_cfg);
    const _auth     = firebase.auth();
    const _db       = firebase.firestore();
    const _provider = new firebase.auth.GoogleAuthProvider();

    const errEl = document.createElement('p');
    errEl.style.cssText = 'font-size:.78rem;color:#ff6b8a;margin-top:.8rem;min-height:1rem;';
    document.querySelector('.login-card').appendChild(errEl);

    // 리다이렉트 복귀 처리
    _auth.getRedirectResult()
      .then(r => { if (r && r.user) errEl.textContent = ''; })
      .catch(e => { errEl.textContent = '오류: ' + (e.message || '다시 시도해주세요'); });

    const GOOGLE_BTN_HTML = document.getElementById('google-login-btn').innerHTML;

    async function signInWithGoogle() {
      const btn = document.getElementById('google-login-btn');
      btn.disabled = true;
      btn.textContent = '로그인 중...';
      errEl.textContent = '';

      try {
        await _auth.signInWithPopup(_provider);
      } catch (e) {
        if (e.code === 'auth/popup-blocked' || e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') {
          errEl.textContent = '잠시 후 Google 로그인 페이지로 이동해요...';
          try {
            await _auth.signInWithRedirect(_provider);
          } catch (e2) {
            errEl.textContent = '오류: ' + (e2.message || '다시 시도해주세요');
            btn.disabled = false;
            btn.innerHTML = GOOGLE_BTN_HTML;
          }
        } else {
          errEl.textContent = '오류: ' + (e.message || '다시 시도해주세요');
          btn.disabled = false;
          btn.innerHTML = GOOGLE_BTN_HTML;
        }
      }
    }

    function signOut() {
      _auth.signOut();
    }

    _auth.onAuthStateChanged(user => {
      // 로딩 화면 즉시 숨김
      document.getElementById('loading-screen').style.display = 'none';

      const overlay = document.getElementById('login-overlay');
      const app     = document.getElementById('app');
      if (user) {
        overlay.classList.add('hidden');
        setTimeout(() => { overlay.style.display = 'none'; }, 500);
        app.style.display = 'block';
        document.getElementById('user-avatar').src = user.photoURL || '';
        document.getElementById('user-name').textContent = user.displayName || user.email;
        buildGallery();
        initInbox(user);
      } else {
        overlay.style.display = 'flex';
        overlay.classList.remove('hidden');
        app.style.display = 'none';
      }
    });

    // ── 메시지함 ─────────────────────────────────────────
    let inboxUnsub = null, inboxChatUnsub = null, currentInboxChatId = null;

    async function initInbox(user) {
      const ownedProfile = PROFILES.find(p => p.ownerEmail === user.email);
      if (!ownedProfile) return;

      // 오너 UID 등록
      try {
        await _db.collection('profileOwners').doc(ownedProfile.id).set({
          uid: user.uid, email: user.email,
          name: user.displayName || '',
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });
      } catch(e) { console.warn('오너 등록 실패:', e); }

      document.getElementById('inbox-btn').style.display = 'flex';

      // 읽지 않은 메시지 수 실시간
      _db.collection('chats').where('ownerUid', '==', user.uid)
        .onSnapshot(snap => {
          let total = 0;
          snap.forEach(d => { total += d.data().unreadByOwner || 0; });
          const badge = document.getElementById('inbox-badge');
          badge.textContent = total;
          badge.style.display = total > 0 ? 'inline' : 'none';
        });
    }

    function openInbox() {
      document.getElementById('inbox-panel').classList.add('open');
      loadConversations();
    }
    function closeInbox() {
      document.getElementById('inbox-panel').classList.remove('open');
      if (inboxUnsub) { inboxUnsub(); inboxUnsub = null; }
      if (inboxChatUnsub) { inboxChatUnsub(); inboxChatUnsub = null; }
    }

    function loadConversations() {
      if (inboxUnsub) inboxUnsub();
      const listEl = document.getElementById('inbox-list');
      inboxUnsub = _db.collection('chats')
        .where('ownerUid', '==', _auth.currentUser.uid)
        .orderBy('lastAt', 'desc')
        .onSnapshot(snap => {
          listEl.innerHTML = '';
          if (snap.empty) {
            listEl.innerHTML = '<p style="text-align:center;color:rgba(255,255,255,0.3);padding:2rem;font-size:0.85rem;">아직 메시지가 없어요</p>';
            return;
          }
          snap.forEach(doc => {
            const c = doc.data();
            const div = document.createElement('div');
            div.className = 'inbox-item' + (c.unreadByOwner > 0 ? ' unread' : '');
            div.innerHTML = `
              <img class="inbox-item-avatar" src="${c.visitorPhoto || ''}" onerror="this.src=''" />
              <div class="inbox-item-info">
                <div class="inbox-item-name">${c.visitorName || '익명'}${c.unreadByOwner > 0 ? `<span class="inbox-unread-dot">${c.unreadByOwner}</span>` : ''}</div>
                <div class="inbox-item-last">${c.lastMessage || '채팅을 시작해요'}</div>
              </div>`;
            div.addEventListener('click', () => openInboxChat(doc.id, c));
            listEl.appendChild(div);
          });
        });
    }

    async function openInboxChat(chatId, chatData) {
      currentInboxChatId = chatId;
      document.getElementById('inbox-list-view').style.display = 'none';
      document.getElementById('inbox-chat-view').style.display = 'flex';
      document.getElementById('inbox-chat-title').textContent = chatData.visitorName || '익명';
      try { await _db.collection('chats').doc(chatId).update({ unreadByOwner: 0 }); } catch(e) {}
      if (inboxChatUnsub) inboxChatUnsub();
      inboxChatUnsub = _db.collection('chats').doc(chatId)
        .collection('messages').orderBy('createdAt', 'asc')
        .onSnapshot(snap => {
          const el = document.getElementById('inbox-messages');
          el.innerHTML = '';
          snap.forEach(doc => {
            const msg = doc.data();
            const div = document.createElement('div');
            div.className = 'chat-msg ' + (msg.senderUid === _auth.currentUser.uid ? 'mine' : 'theirs');
            div.textContent = msg.text;
            el.appendChild(div);
          });
          el.scrollTop = el.scrollHeight;
        });
      setTimeout(() => document.getElementById('inbox-input').focus(), 300);
    }

    document.getElementById('inbox-back-btn').addEventListener('click', () => {
      document.getElementById('inbox-chat-view').style.display = 'none';
      document.getElementById('inbox-list-view').style.display = 'flex';
      if (inboxChatUnsub) { inboxChatUnsub(); inboxChatUnsub = null; }
    });

    async function sendInboxMessage() {
      const input = document.getElementById('inbox-input');
      const text  = input.value.trim();
      if (!text || !currentInboxChatId) return;
      input.value = '';
      try {
        await _db.collection('chats').doc(currentInboxChatId).collection('messages').add({
          text,
          senderUid:  _auth.currentUser.uid,
          senderName: _auth.currentUser.displayName || _auth.currentUser.email,
          createdAt:  firebase.firestore.FieldValue.serverTimestamp()
        });
        await _db.collection('chats').doc(currentInboxChatId).update({
          lastMessage: text,
          lastAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch(e) { console.error('전송 실패:', e); }
    }
    document.getElementById('inbox-send-btn').addEventListener('click', sendInboxMessage);
    document.getElementById('inbox-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendInboxMessage(); });

    async function buildGallery() {
      const gallery = document.getElementById('gallery');
      if (gallery.children.length > 0) return;

      const uid = _auth.currentUser.uid;
      const likeCounts = {};
      const userLiked = new Set();

      // 좋아요 수 + 현재 유저 좋아요 여부 로드 (실패해도 프로필은 표시)
      try {
        const [likeSnap, userLikeSnap] = await Promise.all([
          _db.collection('likes').get(),
          _db.collection('userLikes').where('uid', '==', uid).get()
        ]);
        likeSnap.forEach(doc => { likeCounts[doc.id] = doc.data().count || 0; });
        userLikeSnap.forEach(doc => { userLiked.add(doc.data().profileId); });
      } catch(e) { /* 실패해도 프로필은 0/미좋아요 상태로 표시 */ }

      PROFILES.forEach(p => {
        const count = Math.max(0, likeCounts[p.id] || 0);
        const liked = userLiked.has(p.id);

        const a = document.createElement('a');
        a.className = 'profile-card';
        a.href = `profile.html?id=${p.id}`;
        a.innerHTML = `
          <div class="card-photo-wrap">
            <img class="card-photo" src="${p.photo}" alt="${p.name}" style="${p.photoPosition ? `object-position:${p.photoPosition}` : ''}" />
            <div class="card-online"></div>
          </div>
          <div class="card-name">${p.name}</div>
          <div class="card-school">${p.school}</div>
          <div class="card-desc">${p.description}</div>
          <div class="card-btn">프로필 보기 →</div>
          <button class="heart-btn${liked ? ' liked' : ''}" data-id="${p.id}" data-liked="${liked}">
            <span class="heart-icon">${liked ? '❤️' : '🤍'}</span>
            <span class="heart-count">${count}</span>
          </button>
        `;
        gallery.appendChild(a);
      });

      // 하트 버튼 이벤트
      gallery.querySelectorAll('.heart-btn').forEach(btn => {
        btn.addEventListener('click', async e => {
          e.preventDefault(); e.stopPropagation();
          if (btn.disabled) return;
          btn.disabled = true;

          const profileId = btn.dataset.id;
          const liked = btn.dataset.liked === 'true';
          const countEl = btn.querySelector('.heart-count');
          const iconEl  = btn.querySelector('.heart-icon');
          const userLikeRef = _db.collection('userLikes').doc(`${uid}_${profileId}`);
          const likeRef = _db.collection('likes').doc(profileId);
          const increment = firebase.firestore.FieldValue.increment;

          // UI 즉시 반영
          const newLiked = !liked;
          btn.dataset.liked = newLiked;
          btn.classList.toggle('liked', newLiked);
          iconEl.textContent = newLiked ? '❤️' : '🤍';
          countEl.textContent = Math.max(0, parseInt(countEl.textContent || 0) + (newLiked ? 1 : -1));
          if (newLiked) {
            btn.classList.add('pop');
            setTimeout(() => btn.classList.remove('pop'), 400);
          }

          // Firestore 원자적 업데이트
          try {
            if (newLiked) {
              await Promise.all([
                userLikeRef.set({ uid, profileId }),
                likeRef.set({ count: increment(1) }, { merge: true })
              ]);
            } else {
              await Promise.all([
                userLikeRef.delete(),
                likeRef.set({ count: increment(-1) }, { merge: true })
              ]);
            }
          } catch(err) {
            // 실패 시 UI 롤백
            btn.dataset.liked = liked;
            btn.classList.toggle('liked', liked);
            iconEl.textContent = liked ? '❤️' : '🤍';
            countEl.textContent = Math.max(0, parseInt(countEl.textContent || 0) + (liked ? 1 : -1));
          }

          btn.disabled = false;
        });
      });
    }
  </script>
</body>
