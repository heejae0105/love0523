<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>소개팅 💘</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #080818;
      min-height: 100vh;
      color: #fff;
    }

    /* 배경 그라디언트 */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(255,100,150,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(150,100,255,0.08) 0%, transparent 60%);
    }

    /* 헤더 */
    header {
      position: relative; z-index: 1;
      text-align: center;
      padding: 3.5rem 1rem 1.5rem;
    }
    header h1 {
      font-size: 2.8rem; font-weight: 900;
      background: linear-gradient(135deg, #ff6496, #c064ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.03em;
      margin-bottom: 0.4rem;
    }
    header p {
      font-size: 0.92rem; color: rgba(255,255,255,0.4); font-weight: 300;
    }

    /* 갤러리 그리드 */
    .gallery {
      position: relative; z-index: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.2rem;
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1.5rem 4rem;
    }

    /* 프로필 카드 */
    .profile-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 1.5rem 1rem;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: all 0.3s ease;
      animation: fadeUp 0.6s cubic-bezier(0.22,1,0.36,1) both;
    }
    .profile-card:nth-child(2) { animation-delay: 0.1s; }
    .profile-card:nth-child(3) { animation-delay: 0.2s; }
    .profile-card:nth-child(4) { animation-delay: 0.3s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .profile-card:hover {
      transform: translateY(-6px);
      border-color: rgba(255,100,150,0.4);
      background: rgba(255,255,255,0.08);
      box-shadow: 0 20px 40px rgba(255,100,150,0.15);
    }

    .card-photo-wrap {
      position: relative;
      width: 100px; height: 100px;
      margin: 0 auto 1rem;
    }
    .card-photo {
      width: 100px; height: 100px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 30%;
      border: 2px solid rgba(255,100,150,0.4);
    }
    .card-status {
      position: absolute;
      bottom: 2px; right: 2px;
      background: #ff6496;
      border: 2px solid #080818;
      width: 14px; height: 14px;
      border-radius: 50%;
      box-shadow: 0 0 8px #ff6496;
      animation: dotPulse 1.8s ease-in-out infinite;
    }
    @keyframes dotPulse {
      0%,100% { opacity: 1; } 50% { opacity: 0.4; }
    }

    .card-name {
      font-size: 1.15rem; font-weight: 700; margin-bottom: 0.25rem;
    }
    .card-school {
      font-size: 0.72rem; color: rgba(255,255,255,0.4); margin-bottom: 0.6rem;
    }
    .card-desc {
      font-size: 0.8rem; color: rgba(255,255,255,0.55);
      line-height: 1.4; margin-bottom: 0.9rem;
    }
    .card-btn {
      display: inline-block;
      padding: 0.4rem 1.2rem;
      background: linear-gradient(135deg, #ff6496, #c064ff);
      border-radius: 999px;
      font-size: 0.78rem; font-weight: 600; color: #fff;
    }

    @media (max-width: 480px) {
      header h1 { font-size: 2rem; }
      .gallery { grid-template-columns: repeat(2, 1fr); gap: 0.8rem; padding: 0 1rem 3rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>소개팅 💘</h1>
    <p>마음에 드는 사람을 골라봐요</p>
  </header>

  <div class="gallery" id="gallery"></div>

  <script src="profiles.js"></script>
  <script>
    const gallery = document.getElementById('gallery');

    PROFILES.forEach(p => {
      const a = document.createElement('a');
      a.className = 'profile-card';
      a.href = `profile.html?id=${p.id}`;
      a.innerHTML = `
        <div class="card-photo-wrap">
          <img class="card-photo" src="${p.photo}" alt="${p.name}" />
          <div class="card-status"></div>
        </div>
        <div class="card-name">${p.name}</div>
        <div class="card-school">${p.school}</div>
        <div class="card-desc">${p.description}</div>
        <div class="card-btn">프로필 보기 →</div>
      `;
      gallery.appendChild(a);
    });
  </script>
</body>
</html>
