<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 대시보드</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #08081a; color: #e0e0f0; min-height: 100vh; }

    /* ── 로그인 ── */
    #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-box {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px; padding: 2.5rem 2rem; width: min(360px, 90vw);
      text-align: center; backdrop-filter: blur(16px);
    }
    .login-box h1 { font-size: 1.4rem; margin-bottom: 0.4rem; }
    .login-box p  { font-size: 0.82rem; color: rgba(255,255,255,0.4); margin-bottom: 2rem; }
    .field { display: flex; flex-direction: column; gap: 0.4rem; text-align: left; margin-bottom: 1rem; }
    .field label { font-size: 0.78rem; color: rgba(255,255,255,0.5); }
    .field input {
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; padding: 0.75rem 1rem; color: #fff;
      font-size: 0.92rem; font-family: 'Noto Sans KR', sans-serif;
      outline: none; transition: border-color 0.2s;
    }
    .field input:focus { border-color: rgba(255,100,150,0.6); }
    .login-err { font-size: 0.8rem; color: #ff6b8a; margin-bottom: 0.8rem; min-height: 1rem; }
    .btn-login {
      width: 100%; padding: 0.85rem;
      background: linear-gradient(135deg, #ff6496, #c064ff);
      border: none; border-radius: 12px; color: #fff;
      font-size: 0.95rem; font-weight: 700; font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer; transition: all 0.25s;
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(255,100,150,0.4); }

    /* ── 대시보드 ── */
    #dashboard { display: none; }
    header {
      background: rgba(255,255,255,0.04); border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 10; backdrop-filter: blur(12px);
    }
    header h1 { font-size: 1.1rem; font-weight: 700; }
    header .sub { font-size: 0.78rem; color: rgba(255,255,255,0.4); }
    .btn-sm {
      padding: 0.45rem 1rem; border-radius: 8px; border: none;
      font-size: 0.8rem; font-weight: 600; font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-logout { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.6); }
    .btn-logout:hover { background: rgba(255,100,150,0.2); color: #fff; }
    .btn-accent { background: linear-gradient(135deg, #ff6496, #c064ff); color: #fff; }
    .btn-accent:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(255,100,150,0.4); }

    .main-area { padding: 2rem; max-width: 1100px; margin: 0 auto; }

    /* ── 통계 ── */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09);
      border-radius: 14px; padding: 1.2rem 1rem; text-align: center;
    }
    .stat-card .num { font-size: 2rem; font-weight: 900; color: #ff8ab4; }
    .stat-card .lbl { font-size: 0.75rem; color: rgba(255,255,255,0.45); margin-top: 0.2rem; }

    /* ── 탭 ── */
    .tabs { display: flex; gap: 0.3rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .tab-btn {
      padding: 0.5rem 1.2rem; border-radius: 999px; border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.5);
      font-size: 0.85rem; font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer; transition: all 0.2s;
    }
    .tab-btn.active { background: linear-gradient(135deg,#ff6496,#c064ff); border-color: transparent; color: #fff; font-weight: 600; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ── 테이블 공통 ── */
    .table-wrap {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; overflow: hidden;
    }
    .table-header {
      padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .table-header h2 { font-size: 0.95rem; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      padding: 0.75rem 1.2rem; text-align: left;
      font-size: 0.72rem; font-weight: 500; color: rgba(255,255,255,0.35);
      text-transform: uppercase; letter-spacing: 0.08em;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    tbody tr { transition: background 0.15s; }
    tbody tr:hover { background: rgba(255,255,255,0.03); }
    tbody td {
      padding: 0.85rem 1.2rem; font-size: 0.88rem;
      color: rgba(255,255,255,0.8); border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .ig-link { color: #ff8ab4; text-decoration: none; font-weight: 500; }
    .ig-link:hover { text-decoration: underline; }
    .loading { padding: 3rem; text-align: center; color: rgba(255,255,255,0.3); font-size: 0.9rem; }
    .empty   { padding: 3rem; text-align: center; color: rgba(255,255,255,0.25); font-size: 0.88rem; }

    /* ── 채팅 뷰 ── */
    .chat-section { display: grid; grid-template-columns: 280px 1fr; gap: 1rem; height: 520px; }
    .chat-list-panel {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; overflow-y: auto;
    }
    .chat-list-item {
      padding: 0.9rem 1.1rem; cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.15s;
    }
    .chat-list-item:hover, .chat-list-item.selected { background: rgba(255,100,150,0.1); }
    .chat-list-item .ci-name { font-size: 0.88rem; font-weight: 600; margin-bottom: 0.2rem; }
    .chat-list-item .ci-sub  { font-size: 0.75rem; color: rgba(255,255,255,0.35); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-view-panel {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; display: flex; flex-direction: column; overflow: hidden;
    }
    .chat-view-header {
      padding: 0.9rem 1.2rem; border-bottom: 1px solid rgba(255,255,255,0.07);
      font-weight: 600; font-size: 0.9rem; color: rgba(255,255,255,0.7);
    }
    .chat-view-msgs { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .msg-bubble {
      max-width: 72%; padding: 0.55rem 0.9rem; border-radius: 16px;
      font-size: 0.88rem; line-height: 1.45; word-break: break-word;
    }
    .msg-bubble.visitor { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.85); align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg-bubble.owner   { background: linear-gradient(135deg,#ff6496,#c064ff); color:#fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg-meta { font-size: 0.7rem; color: rgba(255,255,255,0.3); margin-bottom: 2px; }
    .chat-placeholder { margin: auto; color: rgba(255,255,255,0.2); font-size: 0.85rem; text-align: center; padding: 2rem; }

    /* ── 좋아요 ── */
    .likes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
    .like-card {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09);
      border-radius: 14px; padding: 1.2rem; text-align: center;
    }
    .like-card img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,100,150,0.3); margin-bottom: 0.6rem; }
    .like-card .lc-name { font-weight: 700; margin-bottom: 0.3rem; }
    .like-card .lc-count { font-size: 1.6rem; font-weight: 900; color: #ff8ab4; }
    .like-card .lc-label { font-size: 0.72rem; color: rgba(255,255,255,0.35); }
  </style>
</head>
<body>

  <!-- 로그인 -->
  <div id="login-screen">
    <div class="login-box">
      <h1>🔐 관리자 로그인</h1>
      <p>소개팅 관리자 전용</p>
      <div class="field">
        <label>이메일</label>
        <input type="email" id="admin-email" placeholder="admin@example.com" onkeydown="if(event.key==='Enter')doLogin()" />
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" id="admin-pw" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()" />
      </div>
      <p class="login-err" id="login-err"></p>
      <button class="btn-login" onclick="doLogin()">로그인</button>
    </div>
  </div>

  <!-- 대시보드 -->
  <div id="dashboard">
    <header>
      <div>
        <h1>📊 소개팅 대시보드</h1>
        <div class="sub" id="admin-email-display"></div>
      </div>
      <div style="display:flex;gap:0.6rem;align-items:center;">
        <button class="btn-sm btn-accent" onclick="exportCSV()">CSV 내보내기</button>
        <button class="btn-sm btn-logout" onclick="auth.signOut()">로그아웃</button>
      </div>
    </header>

    <div class="main-area">

      <!-- 통계 -->
      <div class="stats">
        <div class="stat-card"><div class="num" id="stat-total">-</div><div class="lbl">총 지원자</div></div>
        <div class="stat-card"><div class="num" id="stat-today">-</div><div class="lbl">오늘 지원</div></div>
        <div class="stat-card"><div class="num" id="stat-chats">-</div><div class="lbl">총 채팅수</div></div>
        <div class="stat-card"><div class="num" id="stat-msgs">-</div><div class="lbl">총 메시지</div></div>
      </div>

      <!-- 탭 -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('submissions', this)">📋 지원자</button>
        <button class="tab-btn" onclick="switchTab('likes', this)">❤️ 좋아요</button>
        <button class="tab-btn" onclick="switchTab('chats', this)">💬 채팅</button>
      </div>

      <!-- 지원자 탭 -->
      <div id="tab-submissions" class="tab-content active">
        <div class="table-wrap">
          <div class="table-header">
            <h2>지원자 목록</h2>
            <button class="btn-sm" style="background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.6);" onclick="loadSubmissions()">새로고침</button>
          </div>
          <div id="table-body"><div class="loading">불러오는 중...</div></div>
        </div>
      </div>

      <!-- 좋아요 탭 -->
      <div id="tab-likes" class="tab-content">
        <div class="likes-grid" id="likes-grid"><div class="loading">불러오는 중...</div></div>
      </div>

      <!-- 채팅 탭 -->
      <div id="tab-chats" class="tab-content">
        <div class="chat-section">
          <div class="chat-list-panel" id="chat-list-panel">
            <div class="loading">불러오는 중...</div>
          </div>
          <div class="chat-view-panel">
            <div class="chat-view-header" id="chat-view-header">대화를 선택하세요</div>
            <div class="chat-view-msgs" id="chat-view-msgs">
              <div class="chat-placeholder">왼쪽에서 대화를 선택하면<br/>메시지가 여기 표시돼요</div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="profiles.js"></script>
  <script>
    let allData = [];
    let chatMsgUnsub = null;

    // ── 인증 ──────────────────────────────────────────────
    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('admin-email-display').textContent = user.email;
        loadAll();
      } else {
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('dashboard').style.display = 'none';
      }
    });

    async function doLogin() {
      const email = document.getElementById('admin-email').value.trim();
      const pw    = document.getElementById('admin-pw').value;
      const err   = document.getElementById('login-err');
      err.textContent = '';
      try { await auth.signInWithEmailAndPassword(email, pw); }
      catch(e) { err.textContent = '이메일 또는 비밀번호가 올바르지 않아요.'; }
    }

    // ── 전체 로드 ─────────────────────────────────────────
    async function loadAll() {
      await Promise.all([loadSubmissions(), loadLikes(), loadChats()]);
    }

    // ── 탭 전환 ───────────────────────────────────────────
    function switchTab(name, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + name).classList.add('active');
      btn.classList.add('active');
    }

    // ── 지원자 ────────────────────────────────────────────
    async function loadSubmissions() {
      document.getElementById('table-body').innerHTML = '<div class="loading">불러오는 중...</div>';
      try {
        const snap = await db.collection('submissions').orderBy('timestamp', 'desc').get();
        const raw  = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        const seen = new Set();
        allData = raw.filter(d => {
          const key = `${d.profileId||''}__${d.instagramId}`;
          if (seen.has(key)) return false;
          seen.add(key); return true;
        });
        renderSubmissions(allData);
        updateStats(allData);
      } catch(e) {
        document.getElementById('table-body').innerHTML = `<div class="empty">불러오기 실패: ${e.message}</div>`;
      }
    }

    function renderSubmissions(data) {
      if (data.length === 0) {
        document.getElementById('table-body').innerHTML = '<div class="empty">아직 지원자가 없어요 🥲</div>'; return;
      }
      const rows = data.map((d, i) => `
        <tr>
          <td>${data.length - i}</td>
          <td>
            <div style="display:flex;align-items:center;gap:8px;">
              ${d.googlePhoto ? `<img src="${d.googlePhoto}" style="width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,100,150,0.4);" />` : ''}
              <div>
                <div style="font-size:0.82rem;color:rgba(255,255,255,0.5);">${d.googleName||''}</div>
                <div style="font-size:0.75rem;color:rgba(255,255,255,0.3);">${d.googleEmail||''}</div>
              </div>
            </div>
          </td>
          <td><a class="ig-link" href="https://www.instagram.com/${d.instagramId}/" target="_blank">@${d.instagramId}</a></td>
          <td style="color:rgba(255,255,255,0.5);font-size:0.8rem;">${d.profileName||'-'}</td>
          <td style="font-size:0.8rem;color:rgba(255,255,255,0.4);">${fmtDate(d.timestamp)}</td>
        </tr>`).join('');
      document.getElementById('table-body').innerHTML = `
        <table>
          <thead><tr><th>#</th><th>Google 계정</th><th>인스타그램</th><th>지원 대상</th><th>시각</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    function updateStats(data) {
      document.getElementById('stat-total').textContent = data.length;
      const today = new Date().toDateString();
      document.getElementById('stat-today').textContent = data.filter(d => {
        if (!d.timestamp) return false;
        return (d.timestamp.toDate ? d.timestamp.toDate() : new Date(d.timestamp)).toDateString() === today;
      }).length;
    }

    // ── 좋아요 ────────────────────────────────────────────
    async function loadLikes() {
      try {
        const snap = await db.collection('likes').get();
        const counts = {};
        snap.forEach(d => { counts[d.id] = d.data().count || 0; });
        const grid = document.getElementById('likes-grid');
        grid.innerHTML = '';
        PROFILES.forEach(p => {
          const div = document.createElement('div');
          div.className = 'like-card';
          div.innerHTML = `
            <img src="${p.photo}" onerror="this.style.display='none'" />
            <div class="lc-name">${p.name}</div>
            <div class="lc-count">${counts[p.id] || 0}</div>
            <div class="lc-label">좋아요</div>`;
          grid.appendChild(div);
        });
      } catch(e) {
        document.getElementById('likes-grid').innerHTML = `<div class="empty">불러오기 실패: ${e.message}</div>`;
      }
    }

    // ── 채팅 ─────────────────────────────────────────────
    async function loadChats() {
      const panel = document.getElementById('chat-list-panel');
      panel.innerHTML = '<div class="loading">불러오는 중...</div>';
      try {
        const snap = await db.collection('chats').orderBy('lastAt', 'desc').get();
        document.getElementById('stat-chats').textContent = snap.size;

        if (snap.empty) { panel.innerHTML = '<div class="empty">채팅 없음</div>'; return; }

        panel.innerHTML = '';
        let totalMsgs = 0;

        for (const doc of snap.docs) {
          const c = doc.data();
          // 메시지 수 카운트
          try {
            const msgSnap = await db.collection('chats').doc(doc.id).collection('messages').get();
            totalMsgs += msgSnap.size;
          } catch(e) {}

          const div = document.createElement('div');
          div.className = 'chat-list-item';
          div.innerHTML = `
            <div class="ci-name">${c.visitorName || '익명'} → ${c.profileName || c.profileId}</div>
            <div class="ci-sub">${c.lastMessage || '메시지 없음'}</div>`;
          div.addEventListener('click', () => {
            document.querySelectorAll('.chat-list-item').forEach(el => el.classList.remove('selected'));
            div.classList.add('selected');
            openChatView(doc.id, c);
          });
          panel.appendChild(div);
        }
        document.getElementById('stat-msgs').textContent = totalMsgs;
      } catch(e) {
        panel.innerHTML = `<div class="empty">불러오기 실패: ${e.message}</div>`;
      }
    }

    function openChatView(chatId, chatData) {
      document.getElementById('chat-view-header').textContent =
        `${chatData.visitorName || '익명'} → ${chatData.profileName || chatData.profileId}`;
      const msgsEl = document.getElementById('chat-view-msgs');
      msgsEl.innerHTML = '<div class="loading">불러오는 중...</div>';

      if (chatMsgUnsub) chatMsgUnsub();
      chatMsgUnsub = db.collection('chats').doc(chatId)
        .collection('messages').orderBy('createdAt', 'asc')
        .onSnapshot(snap => {
          msgsEl.innerHTML = '';
          if (snap.empty) { msgsEl.innerHTML = '<div class="chat-placeholder">메시지가 없어요</div>'; return; }
          snap.forEach(doc => {
            const msg = doc.data();
            const isOwner = msg.senderUid === chatData.ownerUid;
            const wrap = document.createElement('div');
            wrap.style.display = 'flex';
            wrap.style.flexDirection = 'column';
            wrap.style.alignItems = isOwner ? 'flex-end' : 'flex-start';
            wrap.innerHTML = `
              <div class="msg-meta">${msg.senderName || '익명'} · ${fmtDate(msg.createdAt)}</div>
              <div class="msg-bubble ${isOwner ? 'owner' : 'visitor'}">${escHtml(msg.text)}</div>`;
            msgsEl.appendChild(wrap);
          });
          msgsEl.scrollTop = msgsEl.scrollHeight;
        });
    }

    // ── CSV 내보내기 ──────────────────────────────────────
    function exportCSV() {
      if (allData.length === 0) { alert('데이터가 없어요.'); return; }
      const rows = [['순번','구글이름','구글이메일','인스타그램ID','지원대상','시각']];
      allData.forEach((d, i) => {
        rows.push([i+1, d.googleName||'', d.googleEmail||'', d.instagramId, d.profileName||'', fmtDate(d.timestamp)]);
      });
      const csv = rows.map(r => r.join(',')).join('\n');
      const a = document.createElement('a');
      a.href = 'data:text/csv;charset=utf-8,\uFEFF' + encodeURIComponent(csv);
      a.download = `지원자_${new Date().toLocaleDateString('ko-KR').replace(/\. /g,'-').replace('.','')}.csv`;
      a.click();
    }

    // ── 유틸 ──────────────────────────────────────────────
    function fmtDate(ts) {
      if (!ts) return '-';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleString('ko-KR', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
    }
    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
