<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>소개팅 💘</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── 채팅 패널 ── */
    .chat-panel {
      position: fixed; inset: 0; z-index: 300;
      background: #0a0010;
      display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
    }
    .chat-panel.open { transform: translateX(0); }
    .chat-header {
      display: flex; align-items: center; gap: 0.8rem;
      padding: 1rem 1.2rem;
      background: rgba(60,10,50,0.6);
      border-bottom: 1px solid rgba(255,150,200,0.2);
      backdrop-filter: blur(12px);
    }
    .chat-back-btn {
      background: none; border: none; color: #ff8ab4;
      font-size: 1.3rem; cursor: pointer; padding: 0.2rem 0.4rem;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .chat-profile-img {
      width: 36px; height: 36px; border-radius: 50%;
      object-fit: cover; border: 2px solid rgba(255,100,150,0.4);
    }
    .chat-profile-name { font-weight: 700; font-size: 1rem; }
    .chat-messages-wrap {
      flex: 1; overflow-y: auto; padding: 1rem;
      display: flex; flex-direction: column; gap: 0.5rem;
    }
    .chat-msg {
      max-width: 72%; padding: 0.6rem 0.95rem;
      border-radius: 18px; font-size: 0.9rem; line-height: 1.45;
      word-break: break-word;
    }
    .chat-msg.mine {
      background: linear-gradient(135deg, #ff6496, #c064ff);
      color: #fff; align-self: flex-end; border-bottom-right-radius: 4px;
    }
    .chat-msg.theirs {
      background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.9);
      align-self: flex-start; border-bottom-left-radius: 4px;
    }
    .chat-empty {
      text-align: center; color: rgba(255,255,255,0.3);
      font-size: 0.85rem; margin: auto; padding: 2rem;
    }
    .chat-input-row {
      display: flex; gap: 0.5rem; padding: 0.8rem;
      border-top: 1px solid rgba(255,150,200,0.15);
      background: rgba(60,10,50,0.5);
    }
    .chat-input-row input {
      flex: 1; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,150,200,0.2);
      border-radius: 999px; padding: 0.65rem 1rem;
      color: #fff; font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.9rem; outline: none;
    }
    .chat-input-row input:focus { border-color: rgba(255,100,150,0.5); }
    .chat-input-row button {
      background: linear-gradient(135deg, #ff6496, #c064ff);
      border: none; border-radius: 999px;
      padding: 0.65rem 1.2rem; color: #fff;
      font-weight: 600; cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <a href="index.html" class="back-btn">← 목록</a>

  <main class="main">
    <div class="scene" id="scene">
      <div class="card" id="card">
        <div class="card-glow"></div>

        <div class="photo-section">
          <div class="photo-frame">
            <img id="profile-photo" src="" alt="" class="profile-photo" />
            <div class="photo-ring"></div>
            <div class="photo-ring ring2"></div>
          </div>
          <div class="status-pill">
            <span class="status-dot"></span>모집중
          </div>
        </div>

        <div class="info-section">
          <div class="name-row">
            <h1 class="name" id="profile-name">—</h1>
          </div>
          <p class="profile-school" id="profile-school"></p>
          <p class="description" id="profile-desc"></p>
          <div class="divider"></div>
          <div class="ideal-area">
            <p class="section-label">이상형</p>
            <div class="chips" id="profile-chips"></div>
          </div>
          <button class="cta-btn" id="cta-btn">💌 &nbsp;연락하기</button>
        </div>
      </div>
    </div>
  </main>

  <!-- 연락하기 모달 -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="contact-modal">
      <button class="modal-close" id="modal-close-btn">✕</button>
      <div class="modal-emoji">💌</div>
      <h2>연락하기</h2>
      <p class="modal-sub">팔로우하고 메시지를 보내봐요 ☺️</p>
      <a id="ig-follow-link" class="modal-btn ig-btn" href="#" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white" style="margin-right:8px;flex-shrink:0;">
          <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
        </svg>
        팔로우하기
      </a>
      <button class="modal-btn primary" id="btn-message">💬 메시지 보내기</button>
    </div>
  </div>

  <!-- 채팅 패널 -->
  <div class="chat-panel" id="chat-panel">
    <div class="chat-header">
      <button class="chat-back-btn" id="chat-back-btn">←</button>
      <img class="chat-profile-img" id="chat-profile-img" src="" alt="" />
      <span class="chat-profile-name" id="chat-profile-name"></span>
    </div>
    <div class="chat-messages-wrap" id="chat-messages"></div>
    <div class="chat-input-row">
      <input type="text" id="chat-input" placeholder="메시지를 입력하세요..." autocomplete="off" />
      <button id="chat-send-btn">전송</button>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- 프로필 데이터 -->
  <script src="profiles.js"></script>

  <script>
  // ── 로그인 체크 ─────────────────────────────────────
  let currentUser = null;
  auth.onAuthStateChanged(user => {
    if (!user) { location.href = 'index.html'; return; }
    currentUser = user;
  });

  // ── 프로필 초기화 ───────────────────────────────────
  const profileId = new URLSearchParams(location.search).get('id');
  const profile   = (typeof PROFILES !== 'undefined') && PROFILES.find(p => p.id === profileId);

  if (!profile) { location.href = 'index.html'; }

  document.title = profile.name + ' | 소개팅 💘';
  document.getElementById('profile-photo').src           = profile.photo;
  document.getElementById('profile-photo').alt           = profile.name;
  document.getElementById('profile-name').textContent    = profile.name;
  document.getElementById('profile-school').textContent  = profile.school;
  document.getElementById('profile-desc').textContent    = profile.description;
  document.getElementById('ig-follow-link').href         = 'https://www.instagram.com/' + profile.instagram + '/';
  document.getElementById('chat-profile-img').src        = profile.photo;
  document.getElementById('chat-profile-name').textContent = profile.name;

  const chipsEl = document.getElementById('profile-chips');
  profile.idealType.forEach(t => {
    const d = document.createElement('div');
    d.className = 'chip'; d.textContent = t;
    chipsEl.appendChild(d);
  });

  // 채팅 없는 프로필은 버튼 숨기기
  if (!profile.ownerEmail) {
    document.getElementById('btn-message').style.display = 'none';
  }

  // ── 연락하기 모달 ────────────────────────────────────
  const overlay = document.getElementById('modal-overlay');
  document.getElementById('cta-btn').addEventListener('click', () => overlay.classList.add('active'));
  document.getElementById('modal-close-btn').addEventListener('click', () => overlay.classList.remove('active'));
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('active'); });
  document.getElementById('btn-message').addEventListener('click', () => {
    overlay.classList.remove('active');
    openChat();
  });

  // ── 채팅 ────────────────────────────────────────────
  let chatUnsub = null;
  let currentChatId = null;

  async function openChat() {
    if (!currentUser) return;
    if (!profile.ownerEmail) { alert('이 프로필은 아직 채팅을 지원하지 않아요 😅'); return; }

    let ownerUid;
    try {
      const ownerDoc = await db.collection('profileOwners').doc(profile.id).get();
      if (!ownerDoc.exists) {
        alert('상대방이 아직 준비중이에요 😅\n잠시 후 다시 시도해봐요!');
        return;
      }
      ownerUid = ownerDoc.data().uid;
    } catch(e) {
      alert('채팅을 시작할 수 없어요. 잠시 후 다시 시도해주세요.');
      return;
    }

    if (currentUser.uid === ownerUid) {
      alert('자신의 프로필이에요 😅\n메시지함은 홈 화면에서 확인하세요!');
      return;
    }

    currentChatId = `${profile.id}_${currentUser.uid}`;
    const chatRef = db.collection('chats').doc(currentChatId);

    try {
      const chatDoc = await chatRef.get();
      if (!chatDoc.exists) {
        await chatRef.set({
          profileId:    profile.id,
          profileName:  profile.name,
          visitorUid:   currentUser.uid,
          visitorName:  currentUser.displayName || currentUser.email,
          visitorPhoto: currentUser.photoURL || '',
          ownerUid:     ownerUid,
          participants: [currentUser.uid, ownerUid],
          lastMessage:  '',
          lastAt:       firebase.firestore.FieldValue.serverTimestamp(),
          unreadByOwner: 0
        });
      }
    } catch(e) { alert('채팅을 시작할 수 없어요.'); return; }

    document.getElementById('chat-panel').classList.add('open');

    if (chatUnsub) chatUnsub();
    chatUnsub = db.collection('chats').doc(currentChatId)
      .collection('messages')
      .orderBy('createdAt', 'asc')
      .onSnapshot(snap => {
        const container = document.getElementById('chat-messages');
        if (snap.empty) {
          container.innerHTML = '<p class="chat-empty">첫 메시지를 보내봐요 💌</p>';
          return;
        }
        container.innerHTML = '';
        snap.forEach(doc => {
          const msg = doc.data();
          const div = document.createElement('div');
          div.className = 'chat-msg ' + (msg.senderUid === currentUser.uid ? 'mine' : 'theirs');
          div.textContent = msg.text;
          container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
      });

    setTimeout(() => document.getElementById('chat-input').focus(), 300);
  }

  async function sendMessage() {
    const input = document.getElementById('chat-input');
    const text  = input.value.trim();
    if (!text || !currentChatId || !currentUser) return;
    input.value = '';

    try {
      await db.collection('chats').doc(currentChatId).collection('messages').add({
        text,
        senderUid:  currentUser.uid,
        senderName: currentUser.displayName || currentUser.email,
        createdAt:  firebase.firestore.FieldValue.serverTimestamp()
      });
      await db.collection('chats').doc(currentChatId).update({
        lastMessage:  text,
        lastAt:       firebase.firestore.FieldValue.serverTimestamp(),
        unreadByOwner: firebase.firestore.FieldValue.increment(1)
      });
    } catch(e) { console.error('메시지 전송 실패:', e); }
  }

  document.getElementById('chat-back-btn').addEventListener('click', () => {
    document.getElementById('chat-panel').classList.remove('open');
    if (chatUnsub) { chatUnsub(); chatUnsub = null; }
  });
  document.getElementById('chat-send-btn').addEventListener('click', sendMessage);
  document.getElementById('chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

  // ── Three.js 배경 ────────────────────────────────────
  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg-canvas'), alpha:true, antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth, innerHeight);

  const scene  = new THREE.Scene();
  scene.background = new THREE.Color(0x080818);
  const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
  camera.position.z = 6;

  function mkPts(n, color, size, spread) {
    const g = new THREE.BufferGeometry();
    const p = new Float32Array(n*3);
    for(let i=0;i<n*3;i++) p[i]=(Math.random()-.5)*spread;
    g.setAttribute('position', new THREE.BufferAttribute(p,3));
    return new THREE.Points(g, new THREE.PointsMaterial({color,size,transparent:true,opacity:.65,sizeAttenuation:true}));
  }
  const p1=mkPts(200,0xff6496,.045,22), p2=mkPts(140,0x9664ff,.035,22), p3=mkPts(80,0xffffff,.025,18);
  scene.add(p1,p2,p3);

  const mk=(r,c)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,32,32),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.04}));scene.add(m);return m;};
  const b1=mk(1.8,0xff6496); b1.position.set(-3,2,-4);
  const b2=mk(2.2,0x9664ff); b2.position.set(3.5,-2,-5);

  const mouse={x:0,y:0};
  window.addEventListener('mousemove',e=>{mouse.x=(e.clientX/innerWidth-.5)*2;mouse.y=(e.clientY/innerHeight-.5)*2;});

  let t=0;
  (function loop(){
    requestAnimationFrame(loop); t+=.004;
    p1.rotation.y=t*.18; p1.rotation.x=t*.08;
    p2.rotation.y=-t*.14; p2.rotation.z=t*.06;
    p3.rotation.x=t*.10;
    camera.position.x+=(mouse.x*.4-camera.position.x)*.03;
    camera.position.y+=(-mouse.y*.3-camera.position.y)*.03;
    camera.lookAt(scene.position);
    b1.position.y=2+Math.sin(t)*.3;
    b2.position.y=-2+Math.cos(t*.8)*.4;
    renderer.render(scene,camera);
  })();

  // ── 3D 카드 틸트 ─────────────────────────────────────
  const cardEl=document.getElementById('card'), sceneEl=document.getElementById('scene');
  let cx=0,cy=0,tx=0,ty=0,hov=false;
  sceneEl.addEventListener('mousemove',e=>{const r=cardEl.getBoundingClientRect();tx=-(e.clientY-(r.top+r.height/2))/18;ty=(e.clientX-(r.left+r.width/2))/18;});
  sceneEl.addEventListener('mouseenter',()=>hov=true);
  sceneEl.addEventListener('mouseleave',()=>{hov=false;tx=0;ty=0;});
  sceneEl.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0],r=cardEl.getBoundingClientRect();tx=-(t.clientY-(r.top+r.height/2))/20;ty=(t.clientX-(r.left+r.width/2))/20;},{passive:false});
  sceneEl.addEventListener('touchend',()=>{tx=0;ty=0;});
  (function tilt(){requestAnimationFrame(tilt);const e=hov?.12:.06;cx+=(tx-cx)*e;cy+=(ty-cy)*e;if(Math.abs(cx)>.01||Math.abs(cy)>.01)cardEl.style.transform=`rotateX(${cx}deg) rotateY(${cy}deg)`;})();

  window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
  </script>
</body>
</html>
